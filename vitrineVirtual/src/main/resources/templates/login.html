<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Vitrine ANELIE</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">

        <div style="text-align:center; margin-bottom:24px;">
            <img th:src="@{/logo2.png}" alt="ANELIE"
                 style="height:100px; width:auto; object-fit:contain; margin: 0 auto;">
        </div>
        <p class="auth-subtitle">Área restrita ao lojista</p>

        <!-- Mensagem de erro (enviada como parâmetro de redirect) -->
        <div class="alert alert-danger" th:if="${param.erro}" style="margin-bottom: 18px;">
            E-mail ou senha incorretos. Tente novamente.
        </div>

        <div class="auth-form" id="form-login">

            <div class="form-group">
                <label for="login">E-mail</label>
                <input type="email" id="login" name="login"
                       placeholder="seu@email.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha"
                       placeholder="••••••••" required autocomplete="current-password">
            </div>

            <div class="alert alert-danger" id="msg-erro" style="display:none;">
                E-mail ou senha incorretos. Tente novamente.
            </div>

            <button type="button" class="btn btn-primary btn-full" onclick="fazerLogin()">
                Entrar
            </button>

        </div>

        <div class="auth-footer-link">
            <a th:href="@{/recuperar-senha}">Esqueceu sua senha?</a>
        </div>

    </div>
</div>

<script>
async function fazerLogin() {
    const login = document.getElementById('login').value;
    const senha = document.getElementById('senha').value;
    const msgErro = document.getElementById('msg-erro');

    if (!login || !senha) {
        msgErro.style.display = 'block';
        msgErro.textContent = 'Preencha e-mail e senha.';
        return;
    }

    try {
        const response = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ login, senha })
        });

        if (response.ok) {
            window.location.href = '/admin/inicio';
        } else {
            msgErro.style.display = 'block';
            msgErro.textContent = 'E-mail ou senha incorretos. Tente novamente.';
        }
    } catch (error) {
        msgErro.style.display = 'block';
        msgErro.textContent = 'Erro ao conectar. Tente novamente.';
    }
}

// Permite pressionar Enter para logar
document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') fazerLogin();
});
</script>

</body>
</html>
