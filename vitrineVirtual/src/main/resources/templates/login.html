<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Vitrine ANELIE</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">

        <div style="text-align:center; margin-bottom:24px;">
            <img th:src="@{/logo2.png}" alt="ANELIE"
                 style="height:100px; width:auto; object-fit:contain; margin: 0 auto;">
        </div>
        <p class="auth-subtitle">Área restrita ao lojista</p>

        <!-- Mensagem de erro (enviada como parâmetro de redirect) -->
        <div class="alert alert-danger" th:if="${param.erro}" style="margin-bottom: 18px;">
            E-mail ou senha incorretos. Tente novamente.
        </div>

        <form class="auth-form" th:action="@{/auth/login}" method="post">

            <div class="form-group">
                <label for="login">E-mail</label>
                <input type="email" id="login" name="login"
                       placeholder="seu@email.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha"
                       placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                Entrar
            </button>

        </form>

        <div class="auth-footer-link">
            <a th:href="@{/recuperar-senha}">Esqueceu sua senha?</a>
        </div>

    </div>
</div>

</body>
</html>
