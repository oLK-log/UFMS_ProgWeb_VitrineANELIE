<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Lojista - Vitrine ANELIE</title>

    <link rel="stylesheet" th:href="@{/css/style.css}" >
</head>
<body class="auth-page">

<a th:href="@{/}" class="back-link">← Voltar à vitrine</a>

<div class="auth-header">
    <img th:src="@{/logo3.png}" alt="ANELIE Logo" class="auth-logo">
</div>

<div class="auth-card">

    <div id="mensagem-erro" class="error-message">Credenciais inválidas. Tente novamente.</div>

    <form id="formLogin">
        <div class="form-group">
            <label for="email">Login</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required>
        </div>

        <button type="submit" class="btn-login">Entrar</button>

        <div class="auth-footer-link">
            <a th:href="@{/recuperar-senha}">esqueceu a senha?</a>
        </div>
    </form>
</div>

<script>
    document.getElementById('formLogin').addEventListener('submit', async function(event) {
        event.preventDefault();

        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;
        const msgErro = document.getElementById('mensagem-erro');

        const btn = document.querySelector('.btn-login');
        btn.disabled = true;
        btn.textContent = 'Acessando...';

        try {
            const response = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login: email, senha: senha })
            });

            if (response.ok) {
                window.location.href = '/admin/inicio';
            } else {
                msgErro.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Entrar';
            }
        } catch (error) {
            console.error("Erro na comunicação com a API:", error);
            msgErro.textContent = "Erro no servidor. Tente mais tarde.";
            msgErro.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Entrar';
        }
    });
</script>

</body>
</html>
