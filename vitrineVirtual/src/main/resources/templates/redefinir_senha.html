<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha — Vitrine ANELIE</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">

        <div style="text-align:center; margin-bottom:24px;">
            <img th:src="@{/logo2.png}" alt="ANELIE"
                 style="height:100px; width:auto; object-fit:contain; margin: 0 auto;">
        </div>
        <p class="auth-subtitle">Crie uma nova senha para sua conta</p>

        <!-- Token inválido -->
        <div class="alert alert-danger" th:if="${param.invalido}" style="margin-bottom: 18px;">
            Link inválido ou expirado. Solicite um novo.
        </div>

        <form class="auth-form" th:action="@{/auth/salvar-nova-senha}" method="post">

            <!-- Token oculto vindo da URL -->
            <input type="hidden" name="token" th:value="${param.token}">

            <div class="form-group">
                <label for="novaSenha">Nova senha</label>
                <input type="password" id="novaSenha" name="novaSenha"
                       placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>

            <div class="form-group">
                <label for="confirmarSenha">Confirmar senha</label>
                <input type="password" id="confirmarSenha" name="confirmarSenha"
                       placeholder="Repita a nova senha" required minlength="6">
            </div>

            <button type="submit" class="btn btn-primary btn-full"
                    onclick="return validarSenhas()">
                Salvar nova senha
            </button>

        </form>

        <div class="auth-footer-link">
            <a th:href="@{/login}">Voltar ao login</a>
        </div>

    </div>
</div>

<script>
function validarSenhas() {
    const nova = document.getElementById('novaSenha').value;
    const confirmar = document.getElementById('confirmarSenha').value;
    if (nova !== confirmar) {
        alert('As senhas não coincidem.');
        return false;
    }
    return true;
}
</script>

</body>
</html>
