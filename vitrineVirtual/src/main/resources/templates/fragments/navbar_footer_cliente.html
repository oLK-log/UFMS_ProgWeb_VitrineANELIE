<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Fragment: navbar do cliente -->
<nav th:fragment="navbar-cliente" class="navbar-cliente">
    <a th:href="@{/}" class="brand">
        <img th:src="@{/logo3.png}" alt="ANELIE"
             style="height:48px; width:auto; object-fit:contain;">
    </a>
    <div class="nav-right">
        <a th:href="@{/carrinho}" class="cart-btn">
            🛒 Carrinho
            <span class="cart-count" id="cart-count">0</span>
        </a>
    </div>
</nav>git

<!-- Fragment: footer do cliente -->
<footer th:fragment="footer-cliente" class="footer">
    <img th:src="@{/logo3.png}" alt="ANELIE"
         style="height:40px; width:auto; margin: 0 auto 10px; display:block; opacity:0.7;">
    <p>&copy; 2026 <strong>ANELIE</strong> — Catálogo de Joias. Todos os direitos reservados.</p>
</footer>

</body>
</html>
