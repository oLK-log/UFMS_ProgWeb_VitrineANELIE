<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão - Vitrine ANELIE</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="admin-layout">

<div class="admin-content">

    <div class="admin-top-logo">
        <img th:src="@{/logo3.png}" alt="ANELIE Logo">
    </div>

    <div class="admin-action-links">
        <a th:href="@{/admin/cadastro}">+ Adicionar produto</a>
    </div>

    <div th:if="${mensagemSucesso}"
         style="background: var(--ice-blue-dark); color: var(--text); padding: 12px 16px; margin-bottom: 20px; font-weight: 500;">
        <span th:text="${mensagemSucesso}">Mensagem</span>
    </div>
    <div th:if="${mensagemErro}"
         style="background: #fdecea; color: var(--danger); padding: 12px 16px; margin-bottom: 20px; font-weight: 500; border-left: 4px solid var(--danger);">
        <span th:text="${mensagemErro}">Mensagem de erro</span>
    </div>

    <table class="admin-table">
        <thead>
        <tr>
            <th style="width: 80px;">Imagem</th>
            <th>Produto</th>
            <th>Categoria</th>
            <th>Valor</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>

        <tr th:if="${#lists.isEmpty(produtos)}">
            <td colspan="5" style="text-align: center; color: var(--text-muted); padding: 2rem;">
                Nenhum produto cadastrado no catálogo.
            </td>
        </tr>

        <tr th:each="produto : ${produtos}">

            <td>
                <img th:if="${produto.imagem != null and !produto.imagem.isEmpty()}"
                     th:src="${produto.imagem}" alt="Foto Joia"
                     style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px;">

                <div th:if="${produto.imagem == null or produto.imagem.isEmpty()}"
                     style="width: 50px; height: 50px; background: var(--ice-blue-dark); display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--white); border-radius: 4px;">
                    ✦
                </div>
            </td>

            <td th:text="${produto.nome}">Nome da Joia</td>
            <td th:text="${produto.categoria.nome}">Categoria</td>
            <td th:text="|R$ ${#numbers.formatDecimal(produto.valor, 1, 'POINT', 2, 'COMMA')}|">R$ 0,00</td>

            <td>
                <div style="display: flex; gap: 12px; align-items: center;">
                    <a th:href="@{/admin/editar/{id}(id=${produto.id})}" style="color: var(--text); font-weight: 500;">Editar</a>
                    <span style="color: var(--ice-blue-dark);">|</span>
                    <a th:href="@{/admin/excluir/{id}(id=${produto.id})}"
                       class="btn-danger" style="font-weight: 500;"
                       onclick="return confirm('Tem certeza que deseja excluir esta joia do catálogo?');">Excluir</a>
                </div>
            </td>

        </tr>
        </tbody>
    </table>
</div>

<aside class="sidebar-right">
    <nav class="sidebar-menu">
        <a th:href="@{/admin/inicio}" class="sidebar-item active">PRODUTOS</a>
        <a th:href="@{/admin/categorias}" class="sidebar-item">CATEGORIAS</a>
        <a href="#" class="sidebar-item">VENDAS</a>
    </nav>

    <div style="padding: 0 40px;">
        <h3 style="font-family: var(--font-sans); font-weight: 400; font-size: 24px; margin-bottom: 8px;">Admin</h3>
        <a th:href="@{/recuperar-senha}" style="display: block; font-size: 14px; margin-bottom: 4px; color: var(--text-muted); transition: color 0.2s;">Alterar senha</a>
        <a th:href="@{/admin/logout}" style="display: block; font-size: 14px; color: var(--text-muted); transition: color 0.2s;">Sair</a>
    </div>
</aside>

</body>
</html>
