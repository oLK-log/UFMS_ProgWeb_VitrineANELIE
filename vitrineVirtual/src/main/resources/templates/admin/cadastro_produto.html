<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Joia - ANELIE</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="background: var(--white);">

<a th:href="@{/admin/inicio}" class="back-link">← Voltar ao painel</a>

<div class="auth-header" style="margin-top: 40px;">
    <img th:src="@{/logo3.png}" alt="ANELIE Logo" class="auth-logo">
    <h1 style="font-family: var(--font-sans); font-weight: 400; font-size: 20px; letter-spacing: 0.05em; margin-top: 10px;">GESTÃO DE CATÁLOGO</h1>
</div>

<div class="admin-form-container" style="margin-bottom: 60px; border-radius: var(--radius); border: 1px solid var(--ice-blue-dark);">

    <h2 th:text="${produto.id == null ? 'Cadastrar Nova Joia' : 'Editar Joia'}" style="text-align: center; font-size: 24px;">Cadastrar Produto</h2>

    <form th:action="@{/admin/produtos/salvar}" th:object="${produto}" method="post" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 16px; margin-top: 24px;">

        <input type="hidden" th:field="*{id}" />

        <div class="form-group">
            <label>Nome da Joia:</label>
            <input type="text" th:field="*{nome}" placeholder="Ex: Colar Trevo" required />
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
                <label>Categoria:</label>
                <select th:field="*{categoria}" required style="width: 100%; padding: 12px 14px; border: 1px solid var(--ice-blue-dark); background: var(--white); font-family: var(--font-sans); font-size: 15px;">
                    <option value="" disabled selected>Selecione uma categoria...</option>
                    <option th:each="cat : ${categorias}"
                            th:value="${cat.id}"
                            th:text="${cat.nome}">Anel</option>
                </select>
            </div>
            <div class="form-group">
                <label>Material:</label>
                <input type="text" th:field="*{material}" placeholder="Ex: Prata 925" />
            </div>
        </div>

        <div class="form-group">
            <label>Valor (R$):</label>
            <input type="number" step="0.01" th:field="*{valor}" placeholder="0.00" required />
        </div>

        <div class="form-group" style="background: var(--white); padding: 16px; border: 1px dashed var(--text-muted); border-radius: var(--radius);">
            <label style="margin-bottom: 8px; font-weight: 500;">Imagem da Joia:</label>
            <input type="file" id="file" name="file" accept="image/*" th:required="${produto.id == null}">
            <small th:if="${produto.id != null}" style="display: block; color: var(--text-muted); font-size: 13px; margin-top: 8px;">
                ✦ Deixe em branco para manter a imagem atual.
            </small>
        </div>

        <div class="form-group">
            <label>Descrição:</label>
            <textarea th:field="*{descricao}" placeholder="Conte os detalhes da joia..." rows="4"></textarea>
        </div>

        <div style="display: flex; flex-direction: row; gap: 24px; margin-top: 10px; padding: 16px; background: var(--white); border-radius: var(--radius); border: 1px solid var(--ice-blue-dark);">
            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; text-transform: none; font-size: 15px; color: var(--text); font-weight: 500;">
                <input type="checkbox" th:field="*{destaque}" style="width: 18px; height: 18px; accent-color: var(--text);">
                Destacar na Vitrine
            </label>

            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; text-transform: none; font-size: 15px; color: var(--text); font-weight: 500;">
                <input type="checkbox" th:field="*{oferta}" style="width: 18px; height: 18px; accent-color: var(--text);">
                Colocar em Oferta
            </label>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px;">
            <a th:href="@{/admin/inicio}" class="btn btn-outline" style="text-align: center; padding: 14px;">Cancelar</a>
            <button type="submit" class="btn btn-primary" style="padding: 14px; font-size: 15px;">Salvar Joia</button>
        </div>

    </form>
</div>

</body>
</html>
