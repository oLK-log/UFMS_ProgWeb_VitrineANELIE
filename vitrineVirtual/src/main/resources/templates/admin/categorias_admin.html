<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Categorias - Vitrine ANELIE</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="admin-layout">

<div class="admin-content">

    <div class="admin-top-logo">
        <img th:src="@{/logo3.png}" alt="ANELIE Logo" class="auth-logo">
    </div>

    <div th:if="${mensagemSucesso}"
         style="background: var(--ice-blue-dark); color: var(--text); padding: 12px 16px; margin-bottom: 20px; font-weight: 500;">
        <span th:text="${mensagemSucesso}">Mensagem</span>
    </div>
    <div th:if="${mensagemErro}"
         style="background: #fdecea; color: var(--danger); padding: 12px 16px; margin-bottom: 20px; font-weight: 500; border-left: 4px solid var(--danger);">
        <span th:text="${mensagemErro}">Mensagem de erro</span>
    </div>

    <div style="background: var(--ice-blue-light); padding: 24px; border-radius: var(--radius); margin-bottom: 40px;">
        <h3 style="font-weight: 400; margin-bottom: 16px; text-transform: uppercase; font-size: 16px;">Adicionar Nova Categoria</h3>
        <form th:action="@{/admin/categorias/salvar}" th:object="${novaCategoria}" method="post" style="display: flex; gap: 16px; align-items: flex-end;">
            <div class="form-group" style="margin-bottom: 0; flex: 1;">
                <label>Nome da Categoria</label>
                <input type="text" th:field="*{nome}" placeholder="Ex: Anéis de Prata" required style="border: 1px solid var(--ice-blue-dark);">
            </div>
            <button type="submit" class="btn btn-primary" style="padding: 12px 24px;">Adicionar</button>
        </form>
    </div>

    <table class="admin-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome da Categoria</th>
            <th style="width: 150px;">Ações</th>
        </tr>
        </thead>
        <tbody>

        <tr th:if="${#lists.isEmpty(categorias)}">
            <td colspan="3" style="text-align: center; color: var(--text-muted); padding: 2rem;">
                Nenhuma categoria cadastrada no sistema.
            </td>
        </tr>

        <tr th:each="categoria : ${categorias}">
            <td th:text="${categoria.id}">1</td>
            <td th:text="${categoria.nome}">Nome</td>
            <td>
                <a th:href="@{/admin/categorias/excluir/{id}(id=${categoria.id})}"
                   class="btn-danger" style="font-weight: 500;"
                   onclick="return confirm('Tem certeza que deseja excluir esta categoria?');">Excluir</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<aside class="sidebar-right">
    <nav class="sidebar-menu">
        <a th:href="@{/admin/inicio}" class="sidebar-item">PRODUTOS</a>
        <a th:href="@{/admin/categorias}" class="sidebar-item active">CATEGORIAS</a>
        <a href="#" class="sidebar-item">VENDAS</a>
    </nav>

    <div style="padding: 0 40px;">
        <h3 style="font-family: var(--font-sans); font-weight: 400; font-size: 24px; margin-bottom: 8px;">Admin</h3>
        <a th:href="@{/recuperar-senha}" style="display: block; font-size: 14px; margin-bottom: 4px; color: var(--text-muted); transition: color 0.2s;">Alterar senha</a>
        <a th:href="@{/admin/logout}" style="display: block; font-size: 14px; color: var(--text-muted); transition: color 0.2s;">Sair</a>
    </div>
</aside>

</body>
</html>
