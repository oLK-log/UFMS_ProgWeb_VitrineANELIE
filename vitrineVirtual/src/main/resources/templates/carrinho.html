<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Carrinho — Vitrine ANELIE</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .back-link {
            position: absolute;
            top: 24px;
            left: 24px;
            font-size: 14px;
            color: var(--text-muted);
            transition: var(--transition);
        }
        .back-link:hover {
            color: var(--text);
            text-decoration: underline;
        }
    </style>
</head>
<body>

<a th:href="@{/}" class="back-link">← Voltar à vitrine</a>

<div class="auth-header" style="margin-top: 40px;">
    <img th:src="@{/logo3.png}" alt="ANELIE Logo" class="auth-logo">
    <h1 style="font-family: var(--font-sans); font-weight: 400; font-size: 22px; letter-spacing: 0.05em; margin-top: 10px;">MEU CARRINHO</h1>
</div>

<main class="cart-page">

    <div id="carrinho-vazio" style="display:none; text-align:center; padding:60px 20px; color:var(--text-muted);">
        <p style="font-size:32px; margin-bottom:12px;">🛒</p>
        <p style="margin-bottom:20px; font-size: 16px;">Sua sacola está vazia.</p>
        <a th:href="@{/}" class="btn btn-outline">Explorar joias</a>
    </div>

    <div id="carrinho-itens"></div>

    <div id="carrinho-resumo" style="display:none;">
        <div class="cart-summary">
            <div class="cart-summary-row">
                <span>Subtotal</span>
                <span id="subtotal">R$ 0,00</span>
            </div>
            <div class="cart-summary-row" style="color:var(--text-muted); font-size:14px;">
                <span>Frete</span>
                <span>Calculado no checkout</span>
            </div>
            <div class="cart-summary-row cart-summary-total">
                <span>Total estimado</span>
                <span id="total">R$ 0,00</span>
            </div>
        </div>

        <div style="display:flex; gap:16px; margin-top:24px; justify-content:flex-end;">
            <a th:href="@{/}" class="btn btn-outline">Continuar comprando</a>
            <a th:href="@{/checkout}" class="btn btn-primary" style="padding: 12px 32px;">
                Finalizar pedido →
            </a>
        </div>
    </div>

</main>

<script>
    function formatBRL(v) {
        return 'R$ ' + Number(v).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function renderCarrinho() {
        const carrinho = JSON.parse(localStorage.getItem('carrinho') || '[]');
        const container = document.getElementById('carrinho-itens');
        const vazio = document.getElementById('carrinho-vazio');
        const resumo = document.getElementById('carrinho-resumo');

        container.innerHTML = '';

        if (carrinho.length === 0) {
            vazio.style.display = 'block';
            resumo.style.display = 'none';
            return;
        }
        vazio.style.display = 'none';
        resumo.style.display = 'block';

        let total = 0;
        carrinho.forEach((item, idx) => {
            total += item.valor * item.quantidade;
            const div = document.createElement('div');
            div.className = 'cart-item';

            // Estrutura HTML injetada usando as novas classes
            div.innerHTML = `
            ${item.imagem
                ? `<img src="${item.imagem}" alt="${item.nome}" class="cart-item-img">`
                : `<div class="cart-item-img">✦</div>`}

            <div class="cart-item-info">
                <p style="font-weight: 500; font-size: 16px;">${item.nome}</p>
                <p style="color: var(--text-muted); font-size: 13px;">${formatBRL(item.valor)}</p>
            </div>

            <div class="cart-qty">
                <button onclick="mudarQtd(${idx}, -1)">−</button>
                <span style="min-width: 20px; text-align: center; font-weight: 500;">${item.quantidade}</span>
                <button onclick="mudarQtd(${idx}, 1)">+</button>
            </div>

            <div style="min-width:100px; text-align:right; font-weight:500; font-size: 16px;">
                ${formatBRL(item.valor * item.quantidade)}
            </div>

            <button onclick="removerItem(${idx})" class="cart-remove-btn" title="Remover item">
                ✕
            </button>
        `;
            container.appendChild(div);
        });

        document.getElementById('subtotal').textContent = formatBRL(total);
        document.getElementById('total').textContent = formatBRL(total);
    }

    function mudarQtd(idx, delta) {
        let carrinho = JSON.parse(localStorage.getItem('carrinho') || '[]');
        carrinho[idx].quantidade += delta;
        if (carrinho[idx].quantidade <= 0) carrinho.splice(idx, 1);
        localStorage.setItem('carrinho', JSON.stringify(carrinho));
        renderCarrinho();
    }

    function removerItem(idx) {
        let carrinho = JSON.parse(localStorage.getItem('carrinho') || '[]');
        carrinho.splice(idx, 1);
        localStorage.setItem('carrinho', JSON.stringify(carrinho));
        renderCarrinho();
    }

    // Inicia a renderização
    renderCarrinho();
</script>

</body>
</html>
