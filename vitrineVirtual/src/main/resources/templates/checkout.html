<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — Vitrine ANELIE</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="background: var(--white);">

<a th:href="@{/carrinho}" class="back-link">← Voltar ao carrinho</a>

<div class="auth-header" style="margin-top: 40px;">
    <img th:src="@{/logo3.png}" alt="ANELIE Logo" class="auth-logo">
    <h1 style="font-family: var(--font-sans); font-weight: 400; font-size: 22px; letter-spacing: 0.05em; margin-top: 10px;">FINALIZAR PEDIDO</h1>
</div>

<main class="page-main" style="max-width: 1000px; margin: 0 auto 60px auto; padding: 0 20px;">

    <div style="display:grid; grid-template-columns:1fr 360px; gap:32px; align-items:start;">

        <div style="display:flex; flex-direction:column;">

            <div class="form-section">
                <h3>Seus dados</h3>
                <div style="display:flex; flex-direction:column; gap:16px;">
                    <div class="form-group">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" placeholder="Seu nome" required style="border: 1px solid var(--ice-blue-dark);">
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="seu@email.com" required style="border: 1px solid var(--ice-blue-dark);">
                    </div>
                    <div class="form-group">
                        <label for="telefone">WhatsApp / Telefone</label>
                        <input type="tel" id="telefone" placeholder="(67) 99999-9999" required style="border: 1px solid var(--ice-blue-dark);">
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h3>Modo de entrega</h3>
                <div style="display:flex; flex-direction:column; gap:12px;">

                    <label class="radio-card" id="label-retirada">
                        <input type="radio" name="entrega" value="retirada" id="retirada"
                               onchange="alternarEntrega()" checked
                               style="width:18px;height:18px;accent-color:var(--text);">
                        <div>
                            <p style="font-weight:500; font-size: 15px;">Retirada na loja</p>
                            <p style="font-size:13px; color:var(--text-muted);">Combine o horário com o lojista</p>
                        </div>
                    </label>

                    <label class="radio-card" id="label-entrega">
                        <input type="radio" name="entrega" value="entrega" id="entrega-domicilio"
                               onchange="alternarEntrega()"
                               style="width:18px;height:18px;accent-color:var(--text);">
                        <div>
                            <p style="font-weight:500; font-size: 15px;">Entrega em domicílio</p>
                            <p style="font-size:13px; color:var(--text-muted);">Informe o endereço abaixo</p>
                        </div>
                    </label>

                </div>

                <div id="campos-endereco" style="display:none; flex-direction:column; gap:14px; margin-top:16px;">
                    <div class="form-group">
                        <label for="endereco">Endereço completo</label>
                        <input type="text" id="endereco" placeholder="Rua, número, bairro" style="border: 1px solid var(--ice-blue-dark);">
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
                        <div class="form-group">
                            <label for="cidade">Cidade</label>
                            <input type="text" id="cidade" placeholder="Cidade" style="border: 1px solid var(--ice-blue-dark);">
                        </div>
                        <div class="form-group">
                            <label for="cep">CEP</label>
                            <input type="text" id="cep" placeholder="00000-000" style="border: 1px solid var(--ice-blue-dark);">
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h3>Forma de pagamento</h3>
                <div style="display:flex; flex-direction:column; gap:12px;">
                    <label style="display:flex; align-items:center; gap:10px; cursor:pointer; font-size: 15px;">
                        <input type="radio" name="pagamento" value="pix" checked
                               style="width:16px;height:16px;accent-color:var(--text);">
                        <span>Pix</span>
                    </label>
                    <label style="display:flex; align-items:center; gap:10px; cursor:pointer; font-size: 15px;">
                        <input type="radio" name="pagamento" value="dinheiro"
                               style="width:16px;height:16px;accent-color:var(--text);">
                        <span>Dinheiro</span>
                    </label>
                    <label style="display:flex; align-items:center; gap:10px; cursor:pointer; font-size: 15px;">
                        <input type="radio" name="pagamento" value="cartao"
                               style="width:16px;height:16px;accent-color:var(--text);">
                        <span>Cartão (débito/crédito)</span>
                    </label>
                </div>
            </div>

        </div>

        <div style="position:sticky; top:20px;">
            <div style="background: var(--ice-blue-light); padding: 24px; margin-bottom: 16px;">
                <h3 style="font-weight: 400; text-transform: uppercase; margin-bottom: 16px; font-size: 16px;">Resumo da Compra</h3>

                <div id="resumo-itens" style="font-size:14px; margin-bottom:16px;"></div>

                <div style="display: flex; justify-content: space-between; font-size: 16px; font-weight: 500; border-top: 1px solid var(--ice-blue-dark); padding-top: 16px;">
                    <span>Total estimado</span>
                    <span id="resumo-total" style="color:var(--text);">R$ 0,00</span>
                </div>
            </div>

            <button class="btn btn-primary btn-full"
                    style="font-size:15px; padding:14px;"
                    onclick="finalizarPedido()">
                Gerar pedido →
            </button>
        </div>

    </div>

</main>

<script>
    function formatBRL(v) {
        return 'R$ ' + Number(v).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    // Renderiza o resumo lateral puxando do localStorage
    function renderResumo() {
        const carrinho = JSON.parse(localStorage.getItem('carrinho') || '[]');
        if (carrinho.length === 0) {
            window.location.href = '/carrinho';
            return;
        }
        let total = 0;
        const html = carrinho.map(item => {
            const sub = item.valor * item.quantidade;
            total += sub;
            return `
            <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--white);">
                <span style="color: var(--text-muted);">${item.nome} × ${item.quantidade}</span>
                <span style="font-weight: 500;">${formatBRL(sub)}</span>
            </div>`;
        }).join('');

        document.getElementById('resumo-itens').innerHTML = html;
        document.getElementById('resumo-total').textContent = formatBRL(total);
    }

    // Exibe/oculta campos de endereço dependendo do Radio Button
    function alternarEntrega() {
        const entrega = document.getElementById('entrega-domicilio').checked;
        document.getElementById('campos-endereco').style.display = entrega ? 'flex' : 'none';

        // Atualiza a cor da borda baseado no design "Ice Blue / Dark"
        document.getElementById('label-retirada').style.borderColor = !entrega ? 'var(--text)' : 'var(--ice-blue-dark)';
        document.getElementById('label-entrega').style.borderColor = entrega ? 'var(--text)' : 'var(--ice-blue-dark)';
    }

    // Estado inicial das bordas
    document.getElementById('label-retirada').style.borderColor = 'var(--text)';

    async function finalizarPedido() {
        const nome = document.getElementById('nome').value.trim();
        const email = document.getElementById('email').value.trim();
        const telefone = document.getElementById('telefone').value.trim();
        const modoEntrega = document.querySelector('input[name="entrega"]:checked').value;
        const pagamento = document.querySelector('input[name="pagamento"]:checked').value;

        if (!nome || !email || !telefone) {
            alert('Preencha todos os campos obrigatórios (Nome, E-mail e Telefone).');
            return;
        }

        if (modoEntrega === 'entrega') {
            const endereco = document.getElementById('endereco').value.trim();
            const cidade = document.getElementById('cidade').value.trim();
            if (!endereco || !cidade) {
                alert('Preencha o endereço de entrega.');
                return;
            }
        }

        const carrinho = JSON.parse(localStorage.getItem('carrinho') || '[]');

        const dadosPedido = {
            cliente: { nome, email, telefone },
            entrega: {
                modo: modoEntrega,
                endereco: modoEntrega === 'entrega' ? document.getElementById('endereco').value : null,
                cidade:   modoEntrega === 'entrega' ? document.getElementById('cidade').value : null,
                cep:      modoEntrega === 'entrega' ? document.getElementById('cep').value : null,
            },
            pagamento,
            itens: carrinho
        };

        const btn = document.querySelector('button[onclick="finalizarPedido()"]');
        btn.disabled = true;
        btn.textContent = 'Processando pedido...';

        try {
            const response = await fetch('/api/pedidos/finalizar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dadosPedido)
            });

            if (response.ok) {
                localStorage.setItem('pedidoAtual', JSON.stringify(dadosPedido));
                window.location.href = '/pedido-finalizado';
            } else {
                alert('Ocorreu um erro ao processar o seu pedido. Verifique os dados e tente novamente.');
                btn.disabled = false;
                btn.textContent = 'Gerar pedido →';
            }
        } catch (error) {
            console.error("Erro na comunicação com a API:", error);
            alert('Erro de conexão com o servidor. Tente novamente mais tarde.');
            btn.disabled = false;
            btn.textContent = 'Gerar pedido →';
        }
    }

    // Inicia a renderização assim que a página carrega
    renderResumo();
</script>

</body>
</html>
