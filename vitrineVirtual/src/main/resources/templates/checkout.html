<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — Vitrine ANELIE</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar_footer_cliente :: navbar-cliente}"></div>

<main class="page-main">

    <h1 class="page-title">Finalizar pedido</h1>

    <div style="display:grid; grid-template-columns:1fr 360px; gap:32px; align-items:start;">

        <!-- Formulário -->
        <div style="display:flex; flex-direction:column; gap:20px;">

            <!-- Dados pessoais -->
            <div class="form-section">
                <h3>Seus dados</h3>
                <div style="display:flex; flex-direction:column; gap:16px;">
                    <div class="form-group">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" placeholder="Seu nome" required>
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="seu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="telefone">WhatsApp / Telefone</label>
                        <input type="tel" id="telefone" placeholder="(67) 99999-9999" required>
                    </div>
                </div>
            </div>

            <!-- Modo de entrega -->
            <div class="form-section">
                <h3>Modo de entrega</h3>
                <div style="display:flex; flex-direction:column; gap:12px;">

                    <label style="display:flex; align-items:center; gap:12px; cursor:pointer;
                                  padding:14px; border:1.5px solid var(--cream-2); border-radius:var(--radius);
                                  transition:border-color 0.15s;" id="label-retirada">
                        <input type="radio" name="entrega" value="retirada" id="retirada"
                               onchange="alternarEntrega()" checked
                               style="width:18px;height:18px;accent-color:var(--gold-dark);">
                        <div>
                            <p style="font-weight:500;">Retirada na loja</p>
                            <p style="font-size:13px; color:var(--text-muted);">Combine o horário com o lojista</p>
                        </div>
                    </label>

                    <label style="display:flex; align-items:center; gap:12px; cursor:pointer;
                                  padding:14px; border:1.5px solid var(--cream-2); border-radius:var(--radius);
                                  transition:border-color 0.15s;" id="label-entrega">
                        <input type="radio" name="entrega" value="entrega" id="entrega-domicilio"
                               onchange="alternarEntrega()"
                               style="width:18px;height:18px;accent-color:var(--gold-dark);">
                        <div>
                            <p style="font-weight:500;">Entrega em domicílio</p>
                            <p style="font-size:13px; color:var(--text-muted);">Informe o endereço abaixo</p>
                        </div>
                    </label>

                </div>

                <!-- Campos de endereço (exibidos ao selecionar entrega) -->
                <div id="campos-endereco" style="display:none; margin-top:16px; display:flex; flex-direction:column; gap:14px;">
                    <div class="form-group">
                        <label for="endereco">Endereço completo</label>
                        <input type="text" id="endereco" placeholder="Rua, número, bairro">
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
                        <div class="form-group">
                            <label for="cidade">Cidade</label>
                            <input type="text" id="cidade" placeholder="Cidade">
                        </div>
                        <div class="form-group">
                            <label for="cep">CEP</label>
                            <input type="text" id="cep" placeholder="00000-000">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Forma de pagamento -->
            <div class="form-section">
                <h3>Forma de pagamento</h3>
                <div style="display:flex; flex-direction:column; gap:10px;">
                    <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
                        <input type="radio" name="pagamento" value="pix" checked
                               style="width:16px;height:16px;accent-color:var(--gold-dark);">
                        <span>Pix</span>
                    </label>
                    <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
                        <input type="radio" name="pagamento" value="dinheiro"
                               style="width:16px;height:16px;accent-color:var(--gold-dark);">
                        <span>Dinheiro</span>
                    </label>
                    <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
                        <input type="radio" name="pagamento" value="cartao"
                               style="width:16px;height:16px;accent-color:var(--gold-dark);">
                        <span>Cartão (débito/crédito)</span>
                    </label>
                </div>
            </div>

        </div>

        <!-- Resumo lateral -->
        <div style="position:sticky; top:80px;">
            <div class="cart-summary" style="margin-bottom:16px;">
                <h3 style="font-family:var(--font-serif); font-size:17px; margin-bottom:14px;">Resumo</h3>
                <div id="resumo-itens" style="font-size:14px; color:var(--text-muted); margin-bottom:12px;"></div>
                <div class="cart-summary-row">
                    <span>Total</span>
                    <span id="resumo-total" style="color:var(--gold-dark);">R$ 0,00</span>
                </div>
            </div>

            <button class="btn btn-primary btn-full"
                    style="font-size:16px; padding:14px;"
                    onclick="finalizarPedido()">
                Gerar pedido →
            </button>
        </div>

    </div>

</main>

<!-- Footer -->
<div th:replace="~{fragments/navbar_footer_cliente :: footer-cliente}"></div>

<script>
    function formatBRL(v) {
        return 'R$ ' + Number(v).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    // Renderiza o resumo lateral puxando do localStorage
    function renderResumo() {
        const carrinho = JSON.parse(localStorage.getItem('carrinho') || '[]');
        if (carrinho.length === 0) {
            window.location.href = '/carrinho';
            return;
        }
        let total = 0;
        const html = carrinho.map(item => {
            const sub = item.valor * item.quantidade;
            total += sub;
            return `<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f5f0ea;">
            <span>${item.nome} × ${item.quantidade}</span>
            <span>${formatBRL(sub)}</span>
        </div>`;
        }).join('');

        document.getElementById('resumo-itens').innerHTML = html;
        document.getElementById('resumo-total').textContent = formatBRL(total);

        const qtd = carrinho.reduce((acc, i) => acc + i.quantidade, 0);
        const el = document.getElementById('cart-count');
        if (el) el.textContent = qtd;
    }

    // Exibe/oculta campos de endereço dependendo do Radio Button
    function alternarEntrega() {
        const entrega = document.getElementById('entrega-domicilio').checked;
        document.getElementById('campos-endereco').style.display = entrega ? 'flex' : 'none';

        document.getElementById('label-retirada').style.borderColor =
            !entrega ? 'var(--gold)' : 'var(--cream-2)';
        document.getElementById('label-entrega').style.borderColor =
            entrega ? 'var(--gold)' : 'var(--cream-2)';
    }

    // Estado inicial das bordas
    document.getElementById('label-retirada').style.borderColor = 'var(--gold)';

    async function finalizarPedido() {
        const nome = document.getElementById('nome').value.trim();
        const email = document.getElementById('email').value.trim();
        const telefone = document.getElementById('telefone').value.trim();
        const modoEntrega = document.querySelector('input[name="entrega"]:checked').value;
        const pagamento = document.querySelector('input[name="pagamento"]:checked').value;

        if (!nome || !email || !telefone) {
            alert('Preencha todos os campos obrigatórios (Nome, E-mail e Telefone).');
            return;
        }

        if (modoEntrega === 'entrega') {
            const endereco = document.getElementById('endereco').value.trim();
            const cidade = document.getElementById('cidade').value.trim();
            if (!endereco || !cidade) {
                alert('Preencha o endereço de entrega.');
                return;
            }
        }

        const carrinho = JSON.parse(localStorage.getItem('carrinho') || '[]');

        const dadosPedido = {
            cliente: { nome, email, telefone },
            entrega: {
                modo: modoEntrega,
                endereco: modoEntrega === 'entrega' ? document.getElementById('endereco').value : null,
                cidade:   modoEntrega === 'entrega' ? document.getElementById('cidade').value : null,
                cep:      modoEntrega === 'entrega' ? document.getElementById('cep').value : null,
            },
            pagamento,
            itens: carrinho
        };

        const btn = document.querySelector('button[onclick="finalizarPedido()"]');
        btn.disabled = true;
        btn.textContent = 'Processando pedido...';

        try {
            const response = await fetch('/api/pedidos/finalizar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dadosPedido)
            });

            if (response.ok) {
                localStorage.setItem('pedidoAtual', JSON.stringify(dadosPedido));
                window.location.href = '/pedido-finalizado';
            } else {
                alert('Ocorreu um erro ao processar o seu pedido. Verifique os dados e tente novamente.');
                btn.disabled = false;
                btn.textContent = 'Gerar pedido →';
            }
        } catch (error) {
            console.error("Erro na comunicação com a API:", error);
            alert('Erro de conexão com o servidor. Tente novamente mais tarde.');
            btn.disabled = false;
            btn.textContent = 'Gerar pedido →';
        }
    }

    // Inicia a renderização assim que a página carrega
    renderResumo();
</script>

</body>
</html>
