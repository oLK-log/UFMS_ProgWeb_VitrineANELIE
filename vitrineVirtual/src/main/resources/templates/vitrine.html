<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Digital - ANELIE</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="catalog-body">

<header class="catalog-header">
    <img th:src="@{/logo3.png}" alt="ANELIE Logo" class="catalog-logo">
    <h1>CATÁLOGO DIGITAL</h1>
</header>

<div class="catalog-container">

    <main class="catalog-main">

        <section class="catalog-section">
            <h2>OFERTAS</h2>
            <div class="catalog-grid">
                <a th:each="produto : ${produtos}" th:href="@{/produto/{id}(id=${produto.id})}" class="catalog-card">
                    <div class="img-wrapper">
                        <img th:if="${produto.imagem != null and !produto.imagem.isEmpty()}" th:src="${produto.imagem}" th:alt="${produto.nome}">
                        <div class="placeholder" th:if="${produto.imagem == null or produto.imagem.isEmpty()}">✦</div>
                    </div>
                    <div class="card-info">
                        <p class="name" th:text="${produto.nome}">Nome da Joia</p>
                        <p class="price" th:text="'R$ ' + ${#numbers.formatDecimal(produto.valor, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</p>
                    </div>
                </a>
            </div>
        </section>

        <section class="catalog-section">
            <h2>ADICIONADOS RECENTEMENTE</h2>
            <div class="catalog-grid">
                <a th:each="produto : ${produtos}" th:href="@{/produto/{id}(id=${produto.id})}" class="catalog-card">
                    <div class="img-wrapper">
                        <img th:if="${produto.imagem != null and !produto.imagem.isEmpty()}" th:src="${produto.imagem}" th:alt="${produto.nome}">
                        <div class="placeholder" th:if="${produto.imagem == null or produto.imagem.isEmpty()}">✦</div>
                    </div>
                    <div class="card-info">
                        <p class="name" th:text="${produto.nome}">Nome da Joia</p>
                        <p class="price" th:text="'R$ ' + ${#numbers.formatDecimal(produto.valor, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</p>
                    </div>
                </a>
            </div>
        </section>

    </main>

    <aside class="catalog-sidebar">
        <nav class="sidebar-menu">
            <a href="#" class="menu-item highlight">DESTAQUE</a>
            <a href="#" class="menu-item">OFERTAS</a>
            <a href="#" class="menu-item">ADICIONADOS R.</a>

            <div class="menu-divider">CATEGORIAS</div>

            <a href="#" class="menu-item">ANEL</a>
            <a href="#" class="menu-item">BRINCO</a>
            <a href="#" class="menu-item">COLAR</a>
            <a href="#" class="menu-item">TORNOZELEIRAS</a>
        </nav>

        <div class="sidebar-cart" onclick="window.location.href='/carrinho'">
            <span style="font-size: 26px;">🛒</span>
            <span id="cart-total-sidebar">R$ 0,00</span>
        </div>
    </aside>

</div>

<a th:href="@{/login}" class="floating-admin">Área do lojista</a>

<script>
    // Calcula o valor real total do carrinho lendo o LocalStorage
    function atualizarCarrinhoSidebar() {
        const carrinho = JSON.parse(localStorage.getItem('carrinho') || '[]');
        let total = 0;
        carrinho.forEach(item => total += (item.valor * item.quantidade));
        document.getElementById('cart-total-sidebar').textContent =
            'R$ ' + total.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }
    atualizarCarrinhoSidebar();
</script>

</body>
</html>
